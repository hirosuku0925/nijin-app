name: Build App

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # 【追加】これがないと dist フォルダがなくてエラーになります
      - name: Build Web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # （この下にAndroidのビルドステップが続きます）

  build-desktop:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # 【追加】デスクトップ版でも事前にWebビルドが必要な場合があります
      - name: Build Web assets
        run: npm run build

      - name: Build Electron Mac
        run: npx electron-builder --mac --publish never
